# SurgeLine — target app yang diuji (D2, D9). BUKAN ~/infra/docker-compose.yml.
services:
  target:
    build: ./target
    image: surgeline-target:local
    container_name: "${SURGELINE_TARGET_CONTAINER:-surgeline-target}"
    ports: ["127.0.0.1:${SURGELINE_TARGET_PORT:-8110}:8080"]
    environment:
      SURGELINE_CHAOS_RATE: "${SURGELINE_CHAOS_RATE:-0.05}"
      SURGELINE_CHAOS_SEED: "${SURGELINE_CHAOS_SEED:-1337}"
      SURGELINE_CHAOS_DELAY_SECONDS: "${SURGELINE_CHAOS_DELAY_SECONDS:-2.0}"
    restart: unless-stopped
